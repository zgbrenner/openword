[package]
name = "openword"
version = "0.1.0"
description = "A local-first professional word processor"
authors = ["Zachary Brenner"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
