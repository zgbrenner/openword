name: CI

# Runs on every push to main and every pull request. Nothing in this workflow
# needs a secret, so it behaves identically for pull requests from forks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# One in-flight CI run per ref. Superseded pushes are cancelled so the Windows
# packaging job -- by far the most expensive one -- never sits behind a commit
# nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is what the release pipeline packages with; 24 is the current
        # release line. Two cheap Linux legs, no OS matrix here -- the frontend
        # is platform independent and the Rust job already covers the OS spread.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the app
        run: npm run check

      - name: Type-check the Cloudflare Worker
        run: npm run check:worker

      # tests/writer/ci-contract.test.mjs asserts that this workflow invokes
      # `npm run test:writer` before it builds, so the Writer engine contract
      # suite stays an explicit, separately reported gate. Keep this step name
      # and command if you reorganise the job.
      - name: Writer engine contract tests
        run: npm run test:writer

      # Aggregate suite (Writer + editor). Runs the contract tests a second
      # time, which costs ~1s, and means any suite added to `npm test` later is
      # picked up without editing this workflow.
      - name: Full test suite
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Upload the built frontend
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Only Linux needs system libraries: Windows ships WebView2 and macOS
      # ships WebKit with the OS.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ADVISORY ONLY, on purpose.
      #
      # rustfmt has never run in this repository's CI, so src-tauri/ has no
      # verified formatting baseline. Making this blocking on day one risks
      # turning CI red for a purely cosmetic reason. Run `cargo fmt --all`
      # inside src-tauri/ once, commit the result, then delete the
      # `continue-on-error` line below -- the step is otherwise already the
      # exact gate you want.
      - name: cargo fmt (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

      # The Rust unit tests live in src-tauri/src/lib.rs. They are platform
      # independent, so run them once on the cheapest runner; the Windows and
      # macOS legs exist to catch platform-specific compile errors.
      - name: cargo test
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test

  desktop-windows:
    name: Windows installers (NSIS + MSI)
    # Gated on the frontend job so a broken type-check never burns a
    # ~20 minute Windows build (Windows runner minutes bill at 2x).
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache entry from the `rust` job: this one holds full
          # release-profile codegen artifacts, not `cargo check` metadata.
          key: desktop-release
          # Only main writes the cache; pull requests restore from it. Keeps
          # the 10 GB repository cache budget from filling up with per-PR
          # copies of a fat-LTO release build.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs tauri.conf.json's beforeBuildCommand, which
      # type-checks, runs the Writer contract tests and produces dist/.
      # --bundles is explicit so this job keeps proving both Windows installers
      # package correctly even if bundle.targets in tauri.conf.json changes.
      - name: Package the desktop app
        run: npm run tauri -- build --bundles nsis,msi

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: openword-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # Fail loudly rather than silently uploading nothing: the point of
          # this job is to prove the installers still get produced.
          if-no-files-found: error
          retention-days: 7

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned release tarball rather than upstream's install script, which is
      # fetched from a moving branch. actionlint picks up the shellcheck that
      # is preinstalled on GitHub's Ubuntu runners and lints `run:` blocks too.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Lint workflows
        run: ./actionlint -color
